[workspace]
resolver = "2"
members = ["crates/core", "crates/pipeline"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/alex-evans/ehr-atlas"

[workspace.dependencies]
ehr-atlas-core = { path = "crates/core" }
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.4"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
duckdb = { version = "1.10505", features = ["bundled"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip", "http2", "charset", "multipart", "stream"] }
clap = { version = "4.6", features = ["derive", "env"] }
sha2 = "0.11"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
futures-util = "0.3"

[profile.release]
opt-level = 3
